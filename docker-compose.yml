services:
  postgres:
    image: postgres:16-alpine
    container_name: quaudit-db
    environment:
      POSTGRES_USER: quaudit
      POSTGRES_PASSWORD: quaudit_secret
      POSTGRES_DB: quaudit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaudit -d quaudit"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: quaudit-db-test
    environment:
      POSTGRES_USER: quaudit_test
      POSTGRES_PASSWORD: quaudit_test_secret
      POSTGRES_DB: quaudit_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quaudit_test -d quaudit_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quaudit-app
    environment:
      DATABASE_URL: postgresql://quaudit:quaudit_secret@postgres:5432/quaudit?schema=public
      JWT_SECRET: change-this-to-a-long-random-secret-in-production
      JWT_EXPIRATION: 24h
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
